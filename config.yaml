data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  augmented_dir: "data/augmented"
  embeddings_dir: "data/embeddings"

train:
  batch_size: 32
  img_size: 320
  epochs: 10
  lr: 0.001
  weight_decay: 1e-4
  num_workers: 4
  embedding_size: 512
  margin_s: 30.0
  margin_m: 0.5
  pretrained_backbone: false   # toggle to True to fine-tune a pretrained resnet
  resume_checkpoint: ""        
